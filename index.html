<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparator</title>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container edit-mode" id="app-container">
    <!-- Top global bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 3h5v5M8 21H3v-5M12 12m-3 0a3 3 0 1 0 6 0 3 3 0 1 0 -6 0M21 3L14.5 9.5M3 21l6.5-6.5" />
          </svg>
          <span>Comparator</span>
        </div>
        <span class="status-pill" id="save-status">
          <span class="status-dot"></span>
          <span class="status-text">Saved</span>
        </span>
      </div>
      <div class="header-center">
        <button class="view-toggle-btn active" id="btn-mode-edit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
        <button class="view-toggle-btn" id="btn-mode-render">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Render
        </button>
      </div>
      <div class="header-right">
        <button class="header-btn" id="btn-reset-layout" title="Reset Split to 50/50">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          Reset Layout
        </button>
        <button class="header-btn" id="btn-clear" title="Clear Editor Contents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Clear
        </button>
      </div>
    </header>

    <!-- Workspace area -->
    <main class="workspace">
      <!-- Left Workspace Column -->
      <section class="pane left-pane" id="left-pane">
        <!-- Left Editor View -->
        <div class="pane-content editor-view" id="left-editor-container">
          <textarea class="code-editor" id="left-editor" placeholder="Paste or type left-side markdown here..." spellcheck="false"></textarea>
        </div>

        <!-- Left Rendered View -->
        <div class="pane-content rendered-view hidden" id="left-render-container">
          <div class="rendered-markdown" id="left-render-target"></div>
        </div>
      </section>

      <!-- Middle Divider Column -->
      <div class="divider-column" id="drag-divider">
        <div class="divider-line"></div>
      </div>

      <!-- Right Workspace Column -->
      <section class="pane right-pane" id="right-pane">
        <!-- Right Editor View -->
        <div class="pane-content editor-view" id="right-editor-container">
          <textarea class="code-editor" id="right-editor" placeholder="Paste or type right-side markdown here..." spellcheck="false"></textarea>
        </div>

        <!-- Right Rendered View -->
        <div class="pane-content rendered-view hidden" id="right-render-container">
          <div class="rendered-markdown" id="right-render-target"></div>
        </div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
