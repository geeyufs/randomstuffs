<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Third-party libraries pinned with SRI -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container edit-mode" id="app-container">
    <div class="topbar-reveal-zone" id="topbar-reveal-zone" aria-hidden="true"></div>
    <!-- Top global bar -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 3h5v5M8 21H3v-5M12 12m-3 0a3 3 0 1 0 6 0 3 3 0 1 0 -6 0M21 3L14.5 9.5M3 21l6.5-6.5" />
          </svg>
          <span>Comparator</span>
        </div>
        <div class="library-controls" aria-label="Saved comparator entries">
          <select class="library-select native-library-select" id="group-select" aria-label="Group" tabindex="-1"></select>
          <div class="library-dropdown" id="group-dropdown">
            <button class="library-dropdown-btn" id="group-dropdown-button" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="group-dropdown-label"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="13" height="13"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="library-dropdown-menu hidden" id="group-dropdown-menu" role="listbox"></div>
          </div>
          <button class="icon-btn" id="btn-add-group" type="button" title="Add Group" aria-label="Add group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button class="icon-btn" id="btn-remove-group" type="button" title="Remove Group" aria-label="Remove group">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <select class="library-select native-library-select" id="entry-select" aria-label="Entry" tabindex="-1"></select>
          <div class="library-dropdown" id="entry-dropdown">
            <button class="library-dropdown-btn" id="entry-dropdown-button" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="entry-dropdown-label"></span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="13" height="13"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="library-dropdown-menu hidden" id="entry-dropdown-menu" role="listbox"></div>
          </div>
          <button class="icon-btn" id="btn-add-entry" type="button" title="Add Entry" aria-label="Add entry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
          <button class="icon-btn" id="btn-remove-entry" type="button" title="Remove Entry" aria-label="Remove entry">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
        <button class="save-btn" id="btn-save" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span class="save-btn-text">Saved</span>
        </button>
      </div>
      <div class="header-center">
        <button class="view-toggle-btn active" id="btn-mode-edit" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
          Edit
        </button>
        <button class="view-toggle-btn" id="btn-mode-render" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          Render
        </button>
      </div>
      <div class="header-right">
        <button class="header-btn edit-only" id="btn-add-panel" title="Add New Panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Add New Panel
        </button>
        <button class="header-btn edit-only" id="btn-delete-panel" title="Delete Panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Delete Panel
        </button>
        <button class="header-btn" id="btn-reset-layout" title="Reset Panels to Equal Size">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="12" y1="3" x2="12" y2="21"></line></svg>
          Reset Layout
        </button>
        <button class="header-btn" id="btn-clear" title="Clear Editor Contents">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          Clear All
        </button>
      </div>
    </header>

    <!-- Workspace area -->
    <main class="workspace">
    </main>

    <div class="modal-backdrop hidden" id="delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title">
      <div class="modal">
        <h2 id="delete-confirm-title">Delete panel?</h2>
        <p>This removes the selected panel.</p>
        <label class="modal-checkbox">
          <input type="checkbox" id="delete-confirm-skip">
          <span>Do not ask again</span>
        </label>
        <div class="modal-actions">
          <button class="header-btn" id="btn-delete-cancel" type="button">Cancel</button>
          <button class="header-btn danger-btn" id="btn-delete-confirm" type="button">Delete</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop hidden" id="name-modal" role="dialog" aria-modal="true" aria-labelledby="name-modal-title">
      <div class="modal">
        <h2 id="name-modal-title">Name</h2>
        <label class="modal-input-field">
          <span id="name-modal-label">Name</span>
          <input type="text" id="name-modal-input" autocomplete="off">
        </label>
        <div class="modal-actions">
          <button class="header-btn" id="btn-name-cancel" type="button">Cancel</button>
          <button class="header-btn" id="btn-name-confirm" type="button">Create</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
